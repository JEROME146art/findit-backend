# ==============================
# Application Config
# ==============================
spring.application.name=findit-backend
server.port=8080

# ==============================
# H2 Database Config
# ==============================
spring.datasource.url=jdbc:h2:mem:finditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# JPA / Hibernate Config
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ==============================
# Logging
# ==============================
logging.level.org.springframework=INFO
logging.level.com.findit=DEBUG

# ==============================
# JWT Configuration
# ==============================
app.jwt.secret=mySuperSecretKeyForFindItAppJWTTokenGeneration1234567890ABCDEFGHIJKLMNOP
app.jwt.expiration=86400000

# ==============================
# Thymeleaf Configuration
# ==============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==============================
# DevTools
# ==============================
spring.devtools.restart.enabled=false
spring.jackson.serialization.fail-on-empty-beans=false